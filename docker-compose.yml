services:
  postgres:
    image: postgres:16
    container_name: monty_news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_agg
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    ports:
      # Host 5433 -> container 5432 so this stays separate from the original
      # news_agg app's Postgres on host port 5432.
      - "5433:5432"
    volumes:
      - monty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_agg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  monty_pgdata:
